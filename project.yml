name: Clawk
options:
  bundleIdPrefix: com.kishparikh
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    GENERATE_INFOPLIST_FILE: true
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
    INFOPLIST_KEY_CFBundleDisplayName: Clawk
    INFOPLIST_KEY_UILaunchScreen_Generation: true
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: GN3TH9WD6W
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Clawk:
    type: application
    platform: iOS
    sources:
      - Clawk/Clawk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kishparikh.clawk
schemes:
  Clawk:
    build:
      targets:
        Clawk: all
    run:
      config: Debug
    archive:
      config: Release
